---
- name: Define number of BMH's
  set_fact:
    NUMBER_OF_BMH: "{{ CONTROL_PLANE_MACHINE_COUNT|int +  WORKER_MACHINE_COUNT|int }}"
    general_containers:
    - httpd-infra
    - registry
    - sushy-tools
    - vbmc
    ironic_containers:
    - ironic
    - ironic-endpoint-keepalived
    - ironic-log-watch
    - dnsmasq

- name: Fetch container logs (kind cluster)
  block:

  - name: Create directories for storing container logs (kind cluster)
    file:
      path: "/tmp/{{ CONTAINER_RUNTIME }}/{{ item }}"
      state: directory
    with_items:
    - "{{ ironic_containers }}"
    - "{{ general_containers }}"

  - name: Fetch container logs before pivoting (kind cluster)
    shell: "sudo {{ CONTAINER_RUNTIME }} logs {{ item }} > /tmp/{{ CONTAINER_RUNTIME }}/{{ item }}/stdout.log 2> /tmp/{{ CONTAINER_RUNTIME }}/{{ item }}/stderr.log"
    with_items:
    - "{{ ironic_containers }}"
    - "{{ general_containers }}"

  - name: Remove ironic container from source cluster (kind cluster)
    docker_container:
      name: "{{ item }}"
      state: absent
    with_items: "{{ ironic_containers }}"

  when: BOOTSTRAP_CLUSTER == "kind" and (USE_IRSO != "true") and (IRONIC_RUN_LOCAL == "true")
  become: yes
  become_user: root

- name: Fetch container logs (minikube cluster)
  block:

  - name: Create directories for storing container logs (minikube cluster)
    file:
      path: "/tmp/{{ CONTAINER_RUNTIME }}/{{ item }}"
      state: directory
    with_items: "{{ general_containers }}"

  - name: Fetch container logs before pivoting (minikube cluster)
    shell: "sudo {{ CONTAINER_RUNTIME }} logs {{ item }} > /tmp/{{ CONTAINER_RUNTIME }}/{{ item }}/stdout.log 2> /tmp/{{ CONTAINER_RUNTIME }}/{{ item }}/stderr.log"
    with_items: "{{ general_containers }}"

  become: yes
  become_user: root
  when: BOOTSTRAP_CLUSTER == "minikube"

- name: Remove Ironic from source cluster (minikube cluster)
  kubernetes.core.k8s:
    name: "{{ NAMEPREFIX }}-ironic"
    kind: Deployment
    state: absent
    namespace: "{{ IRONIC_NAMESPACE }}"
  when: BOOTSTRAP_CLUSTER == "minikube"

# When Ironic is deployed in-cluster via IRSO, it is an Ironic CR (not a
# Deployment). Remove the CR and its credentials from the source cluster
# before pivoting so it does not conflict with the target cluster's Ironic.
- name: Remove Ironic CR from source cluster (IRSO)
  kubernetes.core.k8s:
    api_version: ironic.metal3.io/v1alpha1
    kind: Ironic
    name: ironic
    state: absent
    namespace: "{{ IRONIC_NAMESPACE }}"
    wait: yes
    wait_timeout: "{{ (IRONIC_ROLLOUT_WAIT | int) * 60 }}"
  when: USE_IRSO == "true"

- name: Remove ironic-auth secret from source cluster (IRSO)
  kubernetes.core.k8s:
    kind: Secret
    name: ironic-auth
    state: absent
    namespace: "{{ IRONIC_NAMESPACE }}"
  when: USE_IRSO == "true"

- name: Label baremetalhost CRD to pivot.
  shell: "kubectl label --overwrite crds baremetalhosts.metal3.io {{ item }}"
  with_items:
  - clusterctl.cluster.x-k8s.io=""
  - clusterctl.cluster.x-k8s.io/move=""
  - clusterctl.cluster.x-k8s.io/move-hierarchy=""

- name: Label hardwareData CRD to pivot.
  shell: "kubectl label --overwrite crds hardwaredata.metal3.io {{ item }}"
  with_items:
  - clusterctl.cluster.x-k8s.io=""
  - clusterctl.cluster.x-k8s.io/move=""

- name: Obtain target cluster kubeconfig
  kubernetes.core.k8s_info:
    kind: secrets
    name: "{{ CLUSTER_NAME }}-kubeconfig"
    namespace: "{{ NAMESPACE }}"
  register: metal3_kubeconfig

- name: Decode and save cluster kubeconfig
  copy:
    content: "{{ metal3_kubeconfig.resources[0].data.value | b64decode }}"
    dest: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"

- name: Create namespace
  kubernetes.core.k8s:
    name: "{{ NAMESPACE }}"
    kind: Namespace
    state: present
    kubeconfig: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"

- name: Initialize Provider component in target cluster
  vars:
    ipam_release: "{{ lookup('env', 'IPAMRELEASE') }}"
  shell: "clusterctl init --kubeconfig /tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml --core cluster-api:{{ CAPIRELEASE }} --bootstrap kubeadm:{{ CAPIRELEASE }} --control-plane kubeadm:{{ CAPIRELEASE }} --infrastructure metal3:{{ CAPM3RELEASE }} -v 5 --ipam metal3:{{ IPAMRELEASE }}"

# Check for cert-manager pods on the target cluster
- name: Check if cert-manager  pods in running state
  kubernetes.core.k8s_info:
    kind: pods
    namespace: cert-manager
    kubeconfig: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"
    field_selectors:
    - status.phase!=Running
  register: target_running_pods
  retries: 20
  delay: 20
  until: (target_running_pods is succeeded) and (target_running_pods.resources | length == 0)

# Install BMO
- name: Install Baremetal Operator
  shell: "{{ DEPLOY_SCRIPT }} -b {{ BMO_IRONIC_ARGS }}"
  environment:
    BMOPATH: "{{ BMOPATH }}"
    IRONIC_HOST: "{{ IRONIC_HOST }}"
    IRONIC_HOST_IP: "{{ IRONIC_HOST_IP }}"
    KUBECTL_ARGS: "{{ KUBECTL_ARGS }}"
  args:
    chdir: "{{ BMOPATH }}"

# Install Ironic in the target cluster. When USE_IRSO=false,
# fall back to the legacy deploy.sh -i path.
- name: Install ironic-standalone-operator in target cluster
  shell: >
    make -C "{{ IRSOPATH }}" install deploy
    IMG="$({{ metal3_dir }}/lib/get_component_image.sh {{ IRSO_LOCAL_IMAGE | default(IRSO_IMAGE, true) }})"
  environment:
    KUBECONFIG: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"
    REGISTRY: "{{ REGISTRY }}"
  when: USE_IRSO == "true"

- name: Wait for ironic-standalone-operator to be available in target cluster
  kubernetes.core.k8s_info:
    kind: Deployment
    name: ironic-standalone-operator-controller-manager
    namespace: ironic-standalone-operator-system
    kubeconfig: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"
    wait: yes
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
  when: USE_IRSO == "true"

- name: Create ironic-auth secret in target cluster
  no_log: true
  kubernetes.core.k8s:
    state: present
    kubeconfig: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ironic-auth
        namespace: "{{ IRONIC_NAMESPACE }}"
        labels:
          environment.metal3.io/ironic-standalone-operator: "true"
      type: Opaque
      data:
        username: "{{ lookup('file', IRONIC_USERNAME_FILE) | b64encode }}"
        password: "{{ lookup('file', IRONIC_PASSWORD_FILE) | b64encode }}"
  when: USE_IRSO == "true"

- name: Create ironic-cert secret in target cluster (TLS)
  no_log: true
  kubernetes.core.k8s:
    state: present
    kubeconfig: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ironic-cert
        namespace: "{{ IRONIC_NAMESPACE }}"
        labels:
          environment.metal3.io/ironic-standalone-operator: "true"
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ lookup('file', IRONIC_CERT_FILE) | b64encode }}"
        tls.key: "{{ lookup('file', IRONIC_KEY_FILE) | b64encode }}"
  when:
  - USE_IRSO == "true"
  - IRONIC_TLS_SETUP == "true"

# BMO needs the CA secret to trust the Ironic endpoint
- name: Create ironic-cacert secret in target cluster (TLS)
  no_log: true
  kubernetes.core.k8s:
    state: present
    kubeconfig: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ironic-cacert
        namespace: "{{ IRONIC_NAMESPACE }}"
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ lookup('file', IRONIC_CACERT_FILE) | b64encode }}"
        tls.key: "{{ lookup('file', IRONIC_CAKEY_FILE) | b64encode }}"
  when:
  - USE_IRSO == "true"
  - IRONIC_TLS_SETUP == "true"

- name: Resolve Ironic component images for the target cluster
  shell: "{{ metal3_dir }}/lib/get_component_image.sh {{ item.src }}"
  environment:
    REGISTRY: "{{ REGISTRY }}"
  loop:
  - { name: "ironic", src: "{{ IRONIC_LOCAL_IMAGE | default(IRONIC_IMAGE, true) }}" }
  - { name: "ipa_downloader", src: "{{ IPA_DOWNLOADER_LOCAL_IMAGE | default(IPA_DOWNLOADER_IMAGE, true) }}" }
  - { name: "keepalived", src: "{{ IRONIC_KEEPALIVED_LOCAL_IMAGE | default(IRONIC_KEEPALIVED_IMAGE, true) }}" }
  - { name: "mariadb", src: "{{ MARIADB_LOCAL_IMAGE | default(MARIADB_IMAGE, true) }}" }
  register: ironic_images
  when: USE_IRSO == "true"

- name: Build Ironic component image map
  set_fact:
    ironic_image_map: "{{ dict(ironic_images.results | map(attribute='item.name') | zip(ironic_images.results | map(attribute='stdout'))) }}"
  when: USE_IRSO == "true"

- name: Create IronicDatabase CR in target cluster (MariaDB)
  kubernetes.core.k8s:
    state: present
    kubeconfig: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"
    definition:
      apiVersion: ironic.metal3.io/v1alpha1
      kind: IronicDatabase
      metadata:
        name: ironic-db
        namespace: "{{ IRONIC_NAMESPACE }}"
      spec:
        image: "{{ ironic_image_map.mariadb }}"
  when:
  - USE_IRSO == "true"
  - IRONIC_USE_MARIADB == "true"

- name: Create Ironic CR in target cluster
  kubernetes.core.k8s:
    state: present
    kubeconfig: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"
    definition:
      apiVersion: ironic.metal3.io/v1alpha1
      kind: Ironic
      metadata:
        name: ironic
        namespace: "{{ IRONIC_NAMESPACE }}"
      spec:
        apiCredentialsName: ironic-auth
        images:
          deployRamdiskBranch: "{{ IPA_BRANCH }}"
          deployRamdiskDownloader: "{{ ironic_image_map.ipa_downloader }}"
          ironic: "{{ ironic_image_map.ironic }}"
          keepalived: "{{ ironic_image_map.keepalived }}"
        version: "{{ IRSO_IRONIC_VERSION }}"
        networking:
          dhcp:
            rangeBegin: "{{ CLUSTER_DHCP_RANGE_START }}"
            rangeEnd: "{{ CLUSTER_DHCP_RANGE_END }}"
            networkCIDR: "{{ BARE_METAL_PROVISIONER_NETWORK }}"
          interface: "{{ BARE_METAL_PROVISIONER_INTERFACE }}"
          ipAddress: "{{ CLUSTER_BARE_METAL_PROVISIONER_IP }}"
          ipAddressManager: keepalived
        deployRamdisk:
          sshKey: "{{ SSH_PUB_KEY_CONTENT }}"
        extraKernelParams: "{{ (NODES_PLATFORM == 'libvirt') | ternary('console=ttyS0', omit) }}"
        tls: "{{ (IRONIC_TLS_SETUP == 'true') | ternary({'certificateName': 'ironic-cert'}, omit) }}"
        databaseName: "{{ (IRONIC_USE_MARIADB == 'true') | ternary('ironic-db', omit) }}"
  when: USE_IRSO == "true"

- name: Wait for Ironic CR to become Ready in target cluster
  kubernetes.core.k8s_info:
    api_version: ironic.metal3.io/v1alpha1
    kind: Ironic
    name: ironic
    namespace: "{{ IRONIC_NAMESPACE }}"
    kubeconfig: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"
    wait: yes
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: "{{ (IRONIC_ROLLOUT_WAIT | int) * 60 }}"
  when: USE_IRSO == "true"

# Deploy Ironic in the target cluster when IRSO is disabled.
- name: Install Ironic in target cluster (legacy deploy.sh)
  shell: "{{ DEPLOY_SCRIPT }} -i {{ BMO_IRONIC_ARGS }}"
  environment:
    BMOPATH: "{{ BMOPATH }}"
    IRONIC_HOST: "{{ IRONIC_HOST }}"
    IRONIC_HOST_IP: "{{ IRONIC_HOST_IP }}"
    KUBECTL_ARGS: "{{ KUBECTL_ARGS }}"
  args:
    chdir: "{{ BMOPATH }}"
  when: USE_IRSO != "true"

- name: Label baremetalhost CRD in target cluster to pivot back.
  shell: "kubectl --kubeconfig /tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml label crds baremetalhosts.metal3.io {{ item }} --overwrite "
  with_items:
  - clusterctl.cluster.x-k8s.io=""
  - clusterctl.cluster.x-k8s.io/move=""
  - clusterctl.cluster.x-k8s.io/move-hierarchy=""

- name: Label hardwareData CRD in target cluster to pivot back.
  shell: "kubectl --kubeconfig /tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml label crds hardwaredata.metal3.io {{ item }} --overwrite "
  with_items:
  - clusterctl.cluster.x-k8s.io=""
  - clusterctl.cluster.x-k8s.io/move=""

# Check for pods & nodes on the target cluster
- name: Check if pods in running state
  kubernetes.core.k8s_info:
    kind: pods
    kubeconfig: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"
    field_selectors:
    - status.phase!=Running
  register: target_running_pods
  retries: 150
  delay: 20
  until: (target_running_pods is succeeded) and (target_running_pods.resources | length == 0)

- name: Check if all deployments replicas are available
  kubernetes.core.k8s_info:
    kind: Deployment
    kubeconfig: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"
  register: deployments
  retries: 150
  delay: 20
  until: (deployments is succeeded) and (deployments.resources | filter_unavailable_replicas | length == 0 )

- name: Pivot objects to target cluster
  shell: "clusterctl move --to-kubeconfig /tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml -n {{ NAMESPACE }} -v 10"

- name: Remove BMO deployment from source cluster
  kubernetes.core.k8s:
    name: "{{ NAMEPREFIX }}-controller-manager"
    kind: Deployment
    state: absent
    namespace: "{{ IRONIC_NAMESPACE }}"

- name: Verify that all machines are provisioned and running.
  include_tasks: verify_resources_states.yml
  vars:
    kubeconfig: "/tmp/kubeconfig-{{ CLUSTER_NAME }}.yaml"

# Normally as non authenticated user we should
# fail here(get 401) to reach Ironic.
- name: Expect 401 from /v1/nodes ednpoint
  uri:
    url: "{{ IRONIC_URL }}nodes"
    return_content: no
    validate_certs: no
    method: GET
    status_code: [ 401 ]
